quarkus.banner.enabled = false
quarkus.management.enabled = true
quarkus.management.port = 9000
quarkus.native.resources.includes=${{ values.component_id }}-api.json
quarkus.camel.openapi.codegen.model-package=${{ values.java_package }}

camel.context.name = ${{ values.component_id }}
camel.component.rest-openapi.mockIncludePattern = file:camel-mock/**,classpath:camel-mock/**
camel.rest.bindingPackageScan=${quarkus.camel.openapi.codegen.model-package}
camel.rest.bindingMode=json

{%- for consumed_api in values.consumed_apis %}
openapi.client.${{ consumed_api.alias }}.host=http://${{ consumed_api.name }}:8080
{%- endfor %}

{%- if values.event_apis | length > 0 %}
# Set through System environment values; no contract/example broker is used.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
events.registry.url=${APICURIO_REGISTRY_URL:${{ values.schema_registry_api_url }}}
events.enabled=true
%test.events.enabled=false
%test.kafka.bootstrap.servers=localhost:9092
quarkus.kafka.devservices.enabled=false
quarkus.apicurio-registry.devservices.enabled=false
{%- endif %}
