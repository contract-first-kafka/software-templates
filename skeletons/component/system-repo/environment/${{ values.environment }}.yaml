replicas: 1
image:
  pullPolicy: ${{ 'Always' if values.environment == values.buildEnvironment else 'IfNotPresent' }}
route:
  enabled: true
runtime:
  health:
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
  envFromSecretNames: []
{%- if values.kafkaResourceName %}
  env:
    - name: KAFKA_BOOTSTRAP_SERVERS
      valueFrom:
        configMapKeyRef:
          name: ${{ values.kafkaResourceName }}-${{ values.environment }}-connection
          key: KAFKA_BOOTSTRAP_SERVERS
{%- else %}
  env: []
{%- endif %}
