apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.componentName }}
  title: ${{ values.componentName }}
  description: ${{ values.description }}
  annotations:
    backstage.io/kubernetes-id: ${{ values.componentName }}
    contract-first-idp.github.io/scm-provider: ${{ values.scmProvider }}
    contract-first-idp.github.io/scm-host: ${{ values.scmHost }}
    contract-first-idp.github.io/domain-org: ${{ values.domainOrg }}
    contract-first-idp.github.io/domain-repo: ${{ values.domainRepo }}
    contract-first-idp.github.io/repository-name: ${{ values.repositoryName }}
    contract-first-idp.github.io/implementation-profile: ${{ values.implementationProfile }}
spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  system: ${{ values.systemRef }}
{%- set publishers = [] %}
{%- set subscribers = [] %}
{%- for api in values.event_apis or [] %}
{%- for msg in api.messages %}
{%- if msg.role == 'publish' and api.ref not in publishers %}
{%- set publishers = (publishers.push(api.ref), publishers) %}
{%- endif %}
{%- if msg.role == 'consume' and api.ref not in subscribers %}
{%- set subscribers = (subscribers.push(api.ref), subscribers) %}
{%- endif %}
{%- endfor %}
{%- endfor %}
{%- if values.implementsApi or publishers | length > 0 %}
  providesApis:
{%- if values.implementsApi %}
    - ${{ values.apiRef }}
{%- endif %}
{%- for ref in publishers %}
    - ${{ ref }}
{%- endfor %}
{%- endif %}
{%- if values.consumed_apis | length > 0 or subscribers | length > 0 %}
  consumesApis:
{%- for api in values.consumed_apis %}
    - ${{ api.ref }}
{%- endfor %}
{%- endif %}
{%- for ref in subscribers %}
    - ${{ ref }}
{%- endfor %}
